<title>EasySchool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F3F4; --ink:#202124; --ink2:#5F6368; --line:#DADCE0; --track:#E8EAED;
  --accent:#1A73E8; --accent-c:#E8F0FE; --on-accent:#FFFFFF;
  --good:#188038; --good-bg:#E6F4EA; --warn:#B06000; --warn-bg:#FEF7E0; --bad:#C5221F; --bad-bg:#FCE8E6;
  --font-d:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#202124; --surface:#292A2D; --surface2:#35363A; --ink:#E8EAED; --ink2:#9AA0A6; --line:#3C4043; --track:#3C4043;
  --accent:#8AB4F8; --accent-c:#2A3A57; --on-accent:#202124;
  --good:#81C995; --good-bg:#1E3A2A; --warn:#FDD663; --warn-bg:#3B3320; --bad:#F28B82; --bad-bg:#43262A}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#202124; --surface:#292A2D; --surface2:#35363A; --ink:#E8EAED; --ink2:#9AA0A6; --line:#3C4043; --track:#3C4043;
  --accent:#8AB4F8; --accent-c:#2A3A57; --on-accent:#202124;
  --good:#81C995; --good-bg:#1E3A2A; --warn:#FDD663; --warn-bg:#3B3320; --bad:#F28B82; --bad-bg:#43262A}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--font-b);
  padding-block:6px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
#app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,6vw,2.3rem)} h2{font-size:1.25rem} h3{font-size:1.08rem}
p{margin:0}
mark{background:none;color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 .78rem var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sub{color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 200px;min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{background:none;border:0;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand .wm{font:600 1.15rem var(--font-d)}

.btn{min-height:56px;padding:12px 24px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;font-size:1.05rem;cursor:pointer;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .1s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.big{min-height:62px;font-size:1.15rem;padding:14px 32px}
.btn.back{color:var(--ink);padding:10px 20px}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.sm{min-height:48px;padding:8px 18px;font-size:1rem}
.btn[disabled]{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}

.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:28px}
.home h1{font-size:clamp(2.6rem,11vw,4rem);letter-spacing:-.03em;margin-top:6px}
.home .by{color:var(--ink2);font-size:1.05rem}
.home .ask{margin-top:26px;font:600 1.2rem var(--font-d);color:var(--ink2)}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;margin-top:10px}
.cls{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:22px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:130px;justify-content:center;touch-action:manipulation;transition:background .15s,border-color .15s}
.cls:hover{background:var(--surface2);border-color:var(--ink2)}
.cls:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cls b{font:600 3.2rem/1 var(--font-d)}
.cls span{color:var(--ink2);font-size:.95rem}
.cls small{font-size:.82rem;color:var(--accent);font-weight:600;margin-top:6px}
@media (max-width:420px){.classes{grid-template-columns:1fr}.cls{flex-direction:row;gap:14px;min-height:84px;justify-content:flex-start;padding:12px 20px}.cls small{margin:0 0 0 auto}}

.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lvlfull{display:flex;gap:14px;align-items:center}
.av{flex:none;width:72px;height:72px;border-radius:50%;background:var(--accent-c);overflow:hidden}
.av svg{display:block}
.lvlmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lvlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvlhead b{font:600 1.15rem var(--font-d)}
.pct{color:var(--ink2);font-size:.9rem;font-variant-numeric:tabular-nums}
.lvltxt{color:var(--ink2);font-size:.98rem}
.mini{display:flex;align-items:center;gap:10px;min-width:0;width:100%}
.mini .nm{font-size:.88rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.mini .bar{flex:1}

.today{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-c);border-color:transparent}
.today b{font:600 1.2rem var(--font-d)}
.list{display:flex;flex-direction:column;gap:10px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-height:72px;touch-action:manipulation;transition:background .15s}
.item:hover{background:var(--surface2)}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sbadge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink);flex:none}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.item h3{font-size:1.05rem}
.chev{color:var(--ink2);font-size:1.4rem;flex:none}
.weak .card{padding:12px 16px}

.topic{display:flex;flex-direction:column;gap:12px}
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mods .btn{min-height:52px;padding:8px 6px;font-size:.98rem;line-height:1.15;display:flex;flex-direction:column;justify-content:center;gap:1px}
.mods .btn small{font-size:.76rem;font-weight:400;color:var(--ink2)}

.dotsrow{display:flex;gap:6px}
.dotsrow i{width:32px;height:5px;border-radius:99px;background:var(--track)}
.dotsrow i.on{background:var(--accent)}
.explain p.txt{font-size:1.1rem;max-width:62ch}
.coach{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:16px;padding:10px 14px}
.coach .av{width:46px;height:46px}
.coach p{font-weight:500}
.vis{margin:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.vis figcaption{font-size:.92rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.visrow{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;min-width:0;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface)}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.grp{display:grid;grid-template-columns:repeat(4,16px);gap:6px;padding:8px;background:var(--accent-c);border-radius:14px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--accent)}
.pie svg{width:96px;height:96px}
.pie path{stroke:var(--surface);stroke-width:2.5;stroke-linejoin:round}
.pf{fill:var(--accent)} .pe{fill:var(--track)}
.scroll{overflow-x:auto;max-width:100%}
.nlsvg{min-width:520px;width:100%;height:auto;display:block}
.nl{stroke:var(--ink2);stroke-width:2.5;stroke-linecap:round}
.nt{fill:var(--ink);font:600 15px var(--font-b)}
.hop{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;width:100%}
.pairs div{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px 14px;min-width:0}
.pairs .em{font-size:1.7rem;line-height:1;flex:none;width:34px;text-align:center}
.pairs .tx{display:flex;flex-direction:column;min-width:0}
.pairs b{font:600 1.05rem var(--font-d)}
.pairs span{color:var(--ink2);font-size:.95rem}
.lines{display:flex;flex-direction:column;gap:8px;width:100%}
.lines.num{counter-reset:s}
.ln{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:14px;padding:10px 16px;position:relative;overflow-x:auto}
.ln em{font-style:normal;font-size:.82rem;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.ln code{font:600 1.1rem var(--mono)}
.lines.num .ln{counter-increment:s;padding-left:58px;min-height:58px;justify-content:center}
.lines.num .ln::before{content:counter(s);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.pic{max-width:100%;max-height:300px;border-radius:16px;display:block}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .18em;font-variant-numeric:tabular-nums}
.frac>span{padding:0 .22em}
.frac>span:first-child{border-bottom:.09em solid currentColor}

.try{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.try .q{font-weight:600}
.inp{min-height:58px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.2rem;min-width:0;flex:1 1 160px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-c)}
.fb{min-height:1.4em;font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--warn)}
.hint{background:var(--warn-bg);border-radius:14px;padding:10px 16px;font-size:1.02rem}
.hint b{color:var(--warn);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;display:block}

.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;align-items:center;padding:22px 18px}
.fq{font:600 clamp(1.6rem,6vw,2.3rem)/1.18 var(--font-d);letter-spacing:-.02em;text-wrap:balance}
.big-emo{font-size:3.4rem;line-height:1}
.fa{background:var(--accent-c);color:var(--ink);border-radius:14px;padding:10px 18px;font-weight:600;font-size:1.2rem;max-width:100%}
.steps{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.cheer{font:600 1rem var(--font-d);color:var(--accent);text-align:center;min-height:1.3em}
.verdict{border-radius:14px;padding:10px 16px;font-weight:600}
.verdict.ok{background:var(--good-bg);color:var(--good)} .verdict.no{background:var(--bad-bg);color:var(--bad)} .verdict.near{background:var(--warn-bg);color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.stages{display:flex;gap:6px}
.stages span{flex:1;text-align:center;font-size:.8rem;font-weight:600;color:var(--ink2);padding:6px 4px;border-radius:99px;background:var(--surface2)}
.stages span.on{background:var(--accent);color:var(--on-accent)}
.stages span.done{background:var(--accent-c);color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.o{min-height:60px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:1.05rem;text-align:center;touch-action:manipulation}
.o:hover{background:var(--surface2)}
.o.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.o.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.o[disabled]{cursor:default}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate{min-height:76px;border-radius:18px;border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;color:var(--ink);touch-action:manipulation;transition:transform .1s}
.rate:active{transform:scale(.98)}
.rate b{font:600 1.15rem var(--font-d)}
.rate span{font-size:.84rem;color:var(--ink2)}
.rate.a{background:var(--bad-bg)} .rate.h{background:var(--warn-bg)} .rate.g{background:var(--good-bg)}
.rate.sug{border-color:var(--ink)}
@media (max-width:460px){.rates{grid-template-columns:1fr}.rate{flex-direction:row;gap:12px;min-height:58px}}
.lab2{font:600 .82rem var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.pad{display:flex;flex-direction:column;gap:10px}
.padbar{display:flex;flex-wrap:wrap;gap:8px}
.tool{min-height:46px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}
.tool.on{border-color:var(--accent);background:var(--accent-c)}
.tool .sw{width:14px;height:14px;border-radius:50%;display:inline-block}
.sw.ink{background:var(--ink)} .sw.accent{background:var(--accent)} .sw.bad{background:var(--bad)} .sw.erase{background:transparent;border:2px dashed var(--ink2)}
.padwrap{border-radius:16px;overflow:hidden;background-color:var(--surface2);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;border:1px solid var(--line)}
.padcv{display:block;width:100%;height:250px;touch-action:none;cursor:crosshair}

.qn{display:flex;flex-direction:column;gap:12px}
.qn .qt{font-weight:600;font-size:1.1rem}
.qn .no{font:600 .78rem var(--font-b);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.opt{display:flex;gap:12px;align-items:center;min-height:58px;padding:10px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:1.05rem}
.opt:has(input:checked){background:var(--accent-c);border-color:var(--accent)}
.opt input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.timer{font:600 1.4rem var(--font-d);font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:99px;padding:6px 16px}
.timer.late{background:var(--bad-bg);color:var(--bad)}
.grade{font:600 4.4rem/1 var(--font-d);letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.res{display:flex;gap:12px;align-items:flex-start}
.res .tag{flex:none;font:700 .72rem var(--font-b);letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:4px 10px}
.tag.ok{background:var(--good-bg);color:var(--good)} .tag.no{background:var(--bad-bg);color:var(--bad)}
.res .body{display:flex;flex-direction:column;gap:2px;min-width:0}
.res .why{color:var(--ink2);font-size:.94rem}
.sync{font-size:.85rem;color:var(--ink2);padding-top:4px;text-align:center}
.err{padding:24px}
.joke p:last-child{font-size:1.05rem;margin-top:4px}
.toasts{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:50;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:popin .3s ease;text-align:center}
.toast.gold{background:#F6C945;color:#3A2A00}
@keyframes popin{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.home{align-items:stretch;text-align:center}
.home>.av,.home>.btn{align-self:center}
.clist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;width:100%;text-align:left}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;touch-action:manipulation;transition:background .15s,border-color .15s}
.ccard:hover{background:var(--surface2);border-color:var(--ink2)}
.ccard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cc-top{display:flex;align-items:center;gap:14px}
.cc-t{display:flex;flex-direction:column}
.cc-h{font:600 1.5rem var(--font-d)}
.xpbar{display:flex;flex-direction:column;gap:4px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chp{background:var(--surface2);border-radius:99px;padding:3px 12px;font-size:.85rem;font-weight:600;color:var(--ink)}
.chp.acc{background:var(--accent-c);color:var(--accent)}
.tipcard{text-align:left;margin-top:6px}
.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:84px;height:84px}
details.card summary{cursor:pointer;font:600 1.05rem var(--font-d);min-height:44px;display:flex;align-items:center}
details.card[open] summary{margin-bottom:10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.skin{border:1.5px solid var(--line);border-radius:16px;padding:8px 4px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:.82rem;font-weight:600;touch-action:manipulation}
.skin small{font-weight:400;color:var(--ink2)}
.skin.on{border-color:var(--accent);background:var(--accent-c)}
.skin.lock{opacity:.5;cursor:default}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:14px;padding:10px;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.bdg.off{opacity:.45}
.bonus{margin:10px 0 0;padding-left:20px;color:var(--ink2)}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.flipc{border:1.5px solid var(--line);border-radius:16px;min-height:110px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-align:center;position:relative;background:var(--surface);touch-action:manipulation}
.flipc .back{display:none;color:var(--good);font-weight:700}
.flipc .hintline{font-size:.75rem;color:var(--ink2)}
.flipc.on{background:var(--accent-c)}
.flipc.on .back{display:block}
.flipc.on .hintline{display:none}
.flipc .em{font-size:1.9rem;line-height:1}
.flipc .pr{font-size:.82rem;color:var(--ink2)}
.spk{position:absolute;top:4px;right:4px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);cursor:pointer;font-size:1rem}
.qzq{display:flex;flex-direction:column;gap:8px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;align-items:center}
.slot{min-width:38px;height:46px;border-radius:10px;background:var(--accent-c);display:grid;place-items:center;font:600 1.3rem var(--mono);padding:0 6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-width:50px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:600 1.2rem var(--mono);cursor:pointer;padding:0 12px;touch-action:manipulation;color:var(--ink)}
.tile:hover{background:var(--surface2)}
.tile[disabled]{opacity:.2;cursor:default}
.hint.theory{background:var(--accent-c)}
.hint.theory b{color:var(--accent)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}

<div id="app" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
var DAY=86400000, INT=[0,1,3,7,14,30], LS='lernwerkstatt.v1', DG=50;
var C=null, P={}, nav={view:'home'}, timer=null, cardIdx={}, PADS={}, penTool='ink', lastAct=0, lastSave=0, SKIN=null, TQ=[];
var LANG={engl:'en-GB',franz:'fr-FR'};
var sync={db:null,state:'local',noWrite:false,timers:{},busy:{},last:{}};
var app=document.getElementById('app');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rt(s){return esc(s).replace(/(\d+)\/(\d+)/g,'<span class="frac"><span>$1</span><span>$2</span></span>')}
function stable(o){return JSON.stringify(o,function(k,v){return v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce(function(a,x){a[x]=v[x];return a},{}):v})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- Fortschritt ---------- */
function prog(id){var p=P[id]||(P[id]={});p.cards=p.cards||{};p.exams=p.exams||[];p.seen=p.seen||{};p.days=p.days||{};p.ach=p.ach||{};p.skin=p.skin||'classic';p.skinT=p.skinT||0;p.pw=p.pw||{};p.aura=p.aura||'none';p.auraT=p.auraT||0;p.arm=p.arm||[];return p}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)P=JSON.parse(r)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
function sortEx(a){return a.slice().sort(function(x,y){return x.t-y.t||(x.topic<y.topic?-1:1)})}
function shape(o){return {cards:o.cards||{},seen:o.seen||{},exams:sortEx(o.exams||[]),days:o.days||{},ach:o.ach||{},skin:o.skin||'classic',skinT:o.skinT||0,pw:o.pw||{},aura:o.aura||'none',auraT:o.auraT||0,v:3}}
function prepared(id){return shape(prog(id))}
function save(id){saveLocal();scheduleWrite(id)}
function updateSync(){var el=document.getElementById('sync');if(el)el.textContent=sync.state==='synced'?'Fortschritt: auf allen Geräten gespeichert.':'Fortschritt: nur auf diesem Gerät gespeichert.'}
function scheduleWrite(id){if(!sync.db||sync.noWrite)return;clearTimeout(sync.timers[id]);sync.timers[id]=setTimeout(function(){flush(id)},1500)}
function flush(id){
  if(sync.busy[id]){scheduleWrite(id);return}
  var body=prepared(id);if(stable(body)===sync.last[id])return;
  sync.busy[id]=true;
  sync.db.doc('progress/'+id).set(body).then(function(){sync.last[id]=stable(body);sync.state='synced';updateSync()})
  .catch(function(e){if(e&&e.code==='invalid_argument')sync.noWrite=true;sync.state='local';updateSync()})
  .then(function(){sync.busy[id]=false});
}
function mergeRemote(id,r){
  var p=prog(id),ch=false,rc=r.cards||{},k;
  for(k in rc){var a=p.cards[k],b=rc[k];if(!a||(b.t||0)>(a.t||0)){p.cards[k]=b;ch=true}}
  var have={};p.exams.forEach(function(x){have[x.topic+'@'+x.t]=1});
  (r.exams||[]).forEach(function(x){if(!have[x.topic+'@'+x.t]){p.exams.push(x);ch=true}});
  var rs=r.seen||{};for(k in rs){if((rs[k]||0)>(p.seen[k]||0)){p.seen[k]=rs[k];ch=true}}
  var rd=r.days||{};
  for(k in rd){var da=p.days[k],db_=rd[k];
    if(!da){p.days[k]=db_;ch=true}
    else{['sec','n','ok','xp'].forEach(function(f){if((db_[f]||0)>(da[f]||0)){da[f]=db_[f];ch=true}});if(db_.goal&&!da.goal){da.goal=1;ch=true}}}
  var ra=r.ach||{};for(k in ra){if(!p.ach[k]){p.ach[k]=ra[k];ch=true}}
  if((r.skinT||0)>(p.skinT||0)){p.skin=r.skin||'classic';p.skinT=r.skinT;ch=true}
  var rp=r.pw||{};for(k in rp){if(!p.pw[k]||rp[k]>p.pw[k]){p.pw[k]=rp[k];ch=true}}
  if((r.auraT||0)>(p.auraT||0)){p.aura=r.aura||'none';p.auraT=r.auraT;ch=true}
  sync.last[id]=stable(shape(r));
  if(ch){saveLocal();if(nav.view==='home'||nav.view==='child'||nav.view==='subject'||nav.view==='parent')render()}
  if(stable(prepared(id))!==sync.last[id])scheduleWrite(id);
}
function initDb(){
  try{
    if(!(window.claude&&window.claude.use))return;
    window.claude.use('db').then(function(db){
      if(!db)return;sync.db=db;
      C.children.forEach(function(c){
        try{db.doc('progress/'+c.id).onSnapshot(function(s){if(s.exists)mergeRemote(c.id,s.data())},function(){})}catch(e){}
        scheduleWrite(c.id);
      });
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Tage, Zeit, XP ---------- */
function dkey(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function day(id){var p=prog(id),k=dkey(0);return p.days[k]||(p.days[k]={sec:0,n:0,ok:0,xp:0})}
function peekDay(id,off){return prog(id).days[dkey(off||0)]||{sec:0,n:0,ok:0,xp:0}}
function touch(id){var now=Date.now();if(lastAct&&now-lastAct<90000)day(id).sec+=Math.round((now-lastAct)/1000);lastAct=now;if(now-lastSave>20000){lastSave=now;save(id)}}
function logAnswer(id,ok){var d=day(id);d.n++;if(ok)d.ok++}
function xpTotal(id){var s=0,d=prog(id).days,k;for(k in d)s+=d[k].xp||0;return s}
function plv(xp){return Math.floor(xp/1000)+1}
function fx(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"'")}
function logoSvg(s){return '<svg class="logo" viewBox="0 0 64 64" width="'+s+'" height="'+s+'" aria-hidden="true"><path d="M4 14c9-3 19-2 28 4v34c-9-6-19-7-28-4z" fill="#4285F4"/><path d="M60 14c-9-3-19-2-28 4v34c9-6 19-7 28-4z" fill="#34A853"/><path d="M4 14l0 34M60 14v34" stroke="#fff" stroke-width="0"/><rect x="22" y="24" width="26" height="34" rx="4" fill="#fff" stroke="#EA4335" stroke-width="4"/><rect x="26" y="29" width="18" height="20" rx="1.5" fill="#FBBC05"/><circle cx="35" cy="54" r="1.8" fill="#EA4335"/></svg>'}
var RANK=['Neuling','Rookie','Checker','Durchstarter','Hustler','Mastermind','Brain-Boss','Legende','Endgegner','GOAT'];
function rankName(L){return L<=10?RANK[L-1]:'GOAT +'+(L-10)}
function plinfo(id){var t=xpTotal(id),L=plv(t),x=t%1000;return {xp:t,total:t,L:L,rank:'Level '+L,base:0,next:L*1000,pct:x/1000}}
function streak(id){var d=prog(id).days,s=0,off=0;if(!(d[dkey(0)]&&d[dkey(0)].xp>0))off=1;while(d[dkey(off)]&&d[dkey(off)].xp>0){s++;off++}return s}

var SK=[
 {id:'classic',n:'Classic',lvl:1,r:'common'},
 {id:'phones',n:'Kopfhörer',lvl:2,r:'rare',acc:'phones',hair:'#2F7F86',iris:'#2FA39B'},
 {id:'glasses',n:'Nerd-Brille',lvl:3,r:'rare',acc:'glasses',hair:'#3B3A4F',iris:'#6B7BB8'},
 {id:'cap',n:'Cap',lvl:4,r:'epic',acc:'cap',hair:'#C2506E',iris:'#D4608A'},
 {id:'cat',n:'Katzenohren',lvl:5,r:'epic',acc:'cat',hair:'#6D4FD6',iris:'#8E6BE0'},
 {id:'dragon',n:'Drache',lvl:6,r:'epic',acc:'horns',hair:'#D6452F',iris:'#F6A623'},
 {id:'crown',n:'Krone',lvl:8,r:'legendary',acc:'crown',hair:'#E38B1B',iris:'#E3A02F'},
 {id:'gold',n:'Gold',lvl:10,r:'legendary',acc:'crown',hair:'#D9B13B',iris:'#C98F00'}
];
function skinById(id){return SK.filter(function(s){return s.id===id})[0]||SK[0]}
var POW=[
 {id:'x2',n:'Doppel-XP',ic:'⚡',lvl:2,d:'Die nächste Runde gibt doppelt so viele XP.'},
 {id:'shield',n:'Combo-Schild',ic:'🛡️',lvl:3,d:'Ein Fehler zerstört deine Combo nicht.'},
 {id:'free',n:'Gratis-Tipps',ic:'💡',lvl:5,d:'Tipps kosten in der nächsten Runde nichts.'},
 {id:'skip',n:'Joker',ic:'⏩',lvl:7,d:'Überspringe eine Aufgabe ohne Strafe.'}
];
var AUR=[
 {id:'neon',n:'Neon',ic:'✨',lvl:4},
 {id:'fire',n:'Feuer',ic:'🔥',lvl:6},
 {id:'galaxy',n:'Galaxie',ic:'🌌',lvl:9}
];
var SKIC={classic:'🙂',phones:'🎧',glasses:'🤓',cap:'🧢',cat:'🐱',dragon:'🐲',crown:'👑',gold:'🏆'};
function auraOf(id){var a=AUR.filter(function(x){return x.id===prog(id).aura})[0];return a&&a.lvl<=plinfo(id).L?a.id:'none'}
function skinOf(childId){var s=skinById(prog(childId).skin);if(s.lvl>plinfo(childId).L)s=SK[0];var o={};for(var k in s)o[k]=s[k];o.aura=auraOf(childId);var cc=C&&C.children.filter(function(x){return x.id===childId})[0];if(cc&&cc.img)o.img=cc.img;return o}
function powReady(id,pw){var p=prog(id);return pw.lvl<=plinfo(id).L&&p.pw[pw.id]!==dkey(0)}
var REAL={2:['🍬','Extra Süsses'],3:['🎮','30 Min extra Games'],4:['🍦','Glace nach Wahl'],5:['🛌','Einmal ausschlafen'],6:['🎬','Filmabend aussuchen'],7:['🍔','Burgerkind-Menü'],8:['🍟','McDonald\'s-Besuch'],9:['🎮','1 Std extra Games'],10:['🎡','Ausflug nach Wahl'],11:['🍕','Pizza-Abend'],12:['🎁','Kleines Wunschgeschenk']};
function tiers(upto){
  var out=[],L;
  for(L=1;L<=upto;L++){
    var r=[];if(REAL[L])r.push({ic:REAL[L][0],t:REAL[L][1],real:1});SK.forEach(function(x){if(x.lvl===L&&L>1)r.push({ic:SKIC[x.id],t:x.n})});
    POW.forEach(function(x){if(x.lvl===L)r.push({ic:x.ic,t:x.n})});
    AUR.forEach(function(x){if(x.lvl===L)r.push({ic:x.ic,t:'Aura '+x.n})});
    if(!r.length)r.push({ic:'⭐',t:'Bonus-Rang'});
    out.push({L:L,r:r});
  }
  return out;
}

var ACH={
 first:['Erster Schritt','Die erste Runde geschafft'],
 combo5:['Combo x5','5 richtige in Folge'],
 perfect:['Perfekte Runde','Alles direkt richtig'],
 streak3:['3 Tage am Stück','3 Tage hintereinander geübt'],
 streak7:['Wochen-Serie','7 Tage hintereinander geübt'],
 lv3:['Rang 3','Rang 3 erreicht'],
 lv5:['Rang 5','Rang 5 erreicht'],
 master10:['10 Aufgaben sitzen','10 Aufgaben komplett gelernt'],
 exam5:['Prüfungs-Ass','Note 5 oder besser'],
 pairs:['Memory-Profi','Paare-Spiel geschafft'],
 learn:['Theorie-Fuchs','Ein Thema bis zum Ende angeschaut']
};
function toast(m,k){if(/^Erfolg:|^Neuer Style|^Tagesziel|^Kraft/.test(m))return;var o={m:m,k:k||''};TQ.push(o);drawToasts();setTimeout(function(){TQ=TQ.filter(function(x){return x!==o});drawToasts()},2800)}
function drawToasts(){var el=document.getElementById('toasts');if(el)el.innerHTML=TQ.map(function(t){return '<div class="toast '+t.k+'">'+esc(t.m)+'</div>'}).join('')}
function ach(id,key){var p=prog(id);if(p.ach[key])return;p.ach[key]=Date.now();toast('Erfolg: '+ACH[key][0],'gold');save(id)}
function addXp(id,n){
  var before=plv(xpTotal(id)),d=day(id);d.xp+=n;
  if(!d.goal&&d.xp>=DG){d.goal=1;d.xp+=25;toast('Tagesziel geschafft! +25 XP','gold')}
  var after=plv(xpTotal(id));
  if(after>before){toast('Level '+after+' erreicht!','gold');var sk=SK.filter(function(s){return s.lvl>before&&s.lvl<=after});if(sk.length)toast('Neuer Style: '+sk[0].n,'gold')}
  return n;
}
function capOf(c){return isV(c)?4:3}
function checkPassive(id){
  var s=streak(id);if(s>=3)ach(id,'streak3');if(s>=7)ach(id,'streak7');
  var L=plinfo(id).L;if(L>=3)ach(id,'lv3');if(L>=5)ach(id,'lv5');
  var m=0,p=prog(id);Object.keys(p.cards).forEach(function(k){var x=cardIdx[k];if(x&&p.cards[k].b>=capOf(x.c))m++});
  if(m>=10)ach(id,'master10');
}

/* ---------- Inhalte ---------- */
function topicById(id){return C.topics.filter(function(t){return t.id===id})[0]}
function topicsOf(child,subject){return C.topics.filter(function(t){return t.child===child&&(!subject||t.subject===subject)})}
function subjName(id){var s=C.subjects.filter(function(x){return x.id===id})[0];return s?s.name:id}
function cardsIn(topics){var out=[];topics.forEach(function(t){t.cards.forEach(function(c){out.push({k:t.id+'_'+c.id,c:c,t:t})})});return out}
function stats(child,topics){
  var p=prog(child),now=Date.now(),s={total:0,sits:0,due:0,fresh:0,weak:0};
  cardsIn(topics).forEach(function(x){s.total++;var r=p.cards[x.k];if(!r){s.fresh++;return}if(r.b>=capOf(x.c))s.sits++;if(r.d<=now)s.due++;if(r.b<=1)s.weak++});
  return s;
}
function scopeTopics(child,scope){
  if(scope.type==='topic')return [topicById(scope.id)];
  if(scope.type==='subject')return topicsOf(child,scope.id);
  return topicsOf(child);
}
function buildQueue(child,topics,force){
  var p=prog(child),now=Date.now(),all=cardsIn(topics),MAX=10,fv=0;
  var due=all.filter(function(x){return p.cards[x.k]&&p.cards[x.k].d<=now}).sort(function(a,b){return p.cards[a.k].b-p.cards[b.k].b||p.cards[a.k].d-p.cards[b.k].d});
  var fresh=all.filter(function(x){return !p.cards[x.k]}).filter(function(x){if(isV(x.c)){fv++;return fv<=5}return true});
  var q=due.slice(0,MAX);
  if(q.length<MAX){var room=MAX-q.length;q=q.concat(fresh.slice(0,due.length?Math.min(room,4):room))}
  if(!q.length&&force){q=all.filter(function(x){return p.cards[x.k]}).sort(function(a,b){return p.cards[a.k].b-p.cards[b.k].b||p.cards[a.k].t-p.cards[b.k].t}).slice(0,8)}
  return q.map(function(x){return x.k});
}
function bestNote(child,topicId){var best=0;prog(child).exams.forEach(function(e){if(e.topic===topicId&&e.note>best)best=e.note});return best}
function fmt(n){return String(parseFloat(n.toFixed(2)))}
function grade(score,max){return Math.round((1+5*score/max)*4)/4}

/* ---------- Prüfen ---------- */
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[−–]/g,'-').replace(/\s+/g,' ').replace(/\s*([\/=:+\-·*])\s*/g,'$1').replace(/[.!?\s]+$/,'').trim()}
function plain(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'')}
function loose(s){return plain(norm(s)).replace(/[,;:!?"]/g,'').replace(/\s+/g,' ')}
function checkAns(inp,answers){
  var n=norm(inp||'');if(!n)return {ok:false,empty:true};
  for(var i=0;i<answers.length;i++){if(norm(answers[i])===n)return {ok:true}}
  for(var j=0;j<answers.length;j++){if(plain(norm(answers[j]))===plain(n))return {ok:true,accent:answers[j]}}
  for(var m=0;m<answers.length;m++){if(loose(answers[m])===loose(inp))return {ok:true}}
  return {ok:false};
}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function nearMiss(inp,answers){var a=loose(inp);return answers.some(function(x){var b=loose(x);return b.length>=5&&lev(a,b)<=1})}
function derive(a){return String(a).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s+/g,' ').replace(/[.]+$/,'').trim()}
function wc(s){return s.split(/\s+/).length}
function cardAns(c){return c.ans||[derive(c.a)]}
function checkable(c){return !!c.ans||wc(derive(c.a))<=4}
function isSoft(c){return wc(derive(c.ans?c.ans[0]:c.a))>4}
function isV(c){return c.fw!==undefined}
function textHints(t){
  var w=wc(t);
  if(w>2)return ['Der Satz hat '+w+' Wörter.','Er beginnt mit «'+t.split(' ').slice(0,2).join(' ')+'…»','Die ersten Wörter: «'+t.split(' ').slice(0,Math.ceil(w*0.6)).join(' ')+'…»'];
  return ['Die Lösung hat '+t.length+' Buchstaben.','Sie beginnt mit «'+t.charAt(0)+'».','Die ersten Buchstaben: «'+t.slice(0,Math.max(2,Math.ceil(t.length*0.5)))+'…»'];
}

/* ---------- Mathe-Generator ---------- */
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function lcm(a,b){return a*b/gcd(a,b)}
function red(f){var g=gcd(f[0],f[1])||1;return [f[0]/g,f[1]/g]}
function Fs(f){return f[1]===1?String(f[0]):f[0]+'/'+f[1]}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function rf(){var D=[2,3,4,5,6,8,10,12];for(var t=0;t<50;t++){var d=D[ri(0,D.length-1)],n=ri(1,d-1);if(gcd(n,d)===1)return [n,d]}return [1,2]}
function pies(L,x,y){return L<=12?[{type:'pie',parts:L,filled:x},{type:'pie',parts:L,filled:y}]:null}
function genA(){
  for(var t=0;t<300;t++){
    var a=rf(),c=rf(),e=rf(),raw=[c[0]*e[1],c[1]*e[0]],q=red(raw);
    if(q[1]===1||q[1]>12)continue;
    var L=lcm(a[1],q[1]);if(L>24)continue;
    var x=a[0]*L/a[1],y=q[0]*L/q[1];if(x<=y)continue;
    var res=red([x-y,L]);if(res[1]===1||res[1]>12)continue;
    var s3='= '+(x-y)+'/'+L+(res[0]!==x-y||res[1]!==L?' = '+Fs(res):'');
    return {q:Fs(a)+' − '+Fs(c)+' : '+Fs(e)+' =',a:Fs(res),
      steps:[[Fs(c)+' : '+Fs(e)+' = '+Fs(c)+' · '+e[1]+'/'+e[0]+' = '+raw[0]+'/'+raw[1]+(raw[0]!==q[0]?' = '+Fs(q):''),'Geteilt zuerst: Kehrbruch, dann kürzen'],
             [Fs(a)+' − '+Fs(q)+' = '+x+'/'+L+' − '+y+'/'+L,'Hauptnenner '+L],
             [s3,'Zähler abziehen']],
      hints:['Geteilt kommt vor Minus. Rechne zuerst '+Fs(c)+' : '+Fs(e)+'.','Nimm den Kehrbruch von '+Fs(e)+' und rechne mal.','Das Zwischenergebnis ist '+Fs(q)+'. Suche nun den Hauptnenner von '+a[1]+' und '+q[1]+'.'],
      solvis:pies(L,x,y)};
  }
  return null;
}
function genB(){
  for(var t=0;t<300;t++){
    var a=rf(),c=rf(),e=rf(),L=lcm(c[1],e[1]);
    if(L>24)continue;
    var x=c[0]*L/c[1],y=e[0]*L/e[1];if(x<=y)continue;
    var diff=red([x-y,L]);if(diff[1]===1)continue;
    var raw=[a[0]*diff[0],a[1]*diff[1]],prod=red(raw);if(prod[1]>40||prod[1]===1)continue;

function vDots(v){var g='';for(var i=0;i<v.groups;i++)g+='<span class="grp">'+'<i class="dot"></i>'.repeat(v.size)+'</span>';
  return '<figure class="vis"><div class="dots">'+g+'</div><figcaption>'+v.groups+' Gruppen mit je '+v.size+': '+v.groups+' · '+v.size+' = '+(v.groups*v.size)+'</figcaption></figure>'}
function vPie(v){var r=46,cx=50,cy=50,p=v.parts,s='';
  for(var i=0;i<p;i++){var a0=-Math.PI/2+i*2*Math.PI/p,a1=-Math.PI/2+(i+1)*2*Math.PI/p;
    var d=p===1?'M'+(cx-r)+' '+cy+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0z':'M'+cx+' '+cy+'L'+(cx+r*Math.cos(a0)).toFixed(2)+' '+(cy+r*Math.sin(a0)).toFixed(2)+'A'+r+' '+r+' 0 0 1 '+(cx+r*Math.cos(a1)).toFixed(2)+' '+(cy+r*Math.sin(a1)).toFixed(2)+'Z';
    s+='<path d="'+d+'" class="'+(i<v.filled?'pf':'pe')+'"/>'}
  return '<figure class="vis pie"><svg viewBox="0 0 100 100" role="img" aria-label="'+v.filled+' von '+p+' Teilen gefärbt">'+s+'</svg><figcaption>'+rt(v.filled+'/'+p)+'</figcaption></figure>'}
function vLine(v){var x0=24,x1=576,y=58,n=Math.round((v.max-v.min)/v.step);
  function X(i){return x0+(x1-x0)*i/n}
  var s='<line x1="'+(x0-8)+'" x2="'+(x1+8)+'" y1="'+y+'" y2="'+y+'" class="nl"/>';
  for(var i=0;i<=n;i++){s+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+(y-6)+'" y2="'+(y+6)+'" class="nl"/><text x="'+X(i)+'" y="'+(y+26)+'" text-anchor="middle" class="nt">'+(v.min+i*v.step)+'</text>';
    if(i<n){var xm=(X(i)+X(i+1))/2;s+='<path d="M'+X(i)+' '+(y-8)+'Q'+xm+' '+(y-40)+' '+X(i+1)+' '+(y-8)+'" class="hop"/>'}}
  return '<figure class="vis" style="width:100%"><div class="scroll" style="width:100%"><svg viewBox="0 0 600 90" class="nlsvg" role="img" aria-label="Zahlenstrahl in '+v.step+'er-Schritten">'+s+'</svg></div><figcaption>Immer '+v.step+' weiter</figcaption></figure>'}
function vPairs(v){return '<div class="pairs">'+v.items.map(function(p){return '<div>'+(p[2]?'<span class="em" aria-hidden="true">'+p[2]+'</span>':'')+'<span class="tx"><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></span></div>'}).join('')+'</div>'}
function curLang(){var t=nav.topicId&&topicById(nav.topicId);return t?(LANG[t.subject]||'en-GB'):'en-GB'}
function vFlip(v){
  var lg=curLang();
  return '<div class="flipgrid">'+v.items.map(function(p){
    return '<div class="flipc" data-act="flip" role="button" tabindex="0">'+(v.nospk?'':'<button class="spk" data-act="speak" data-t="'+esc(p[0])+'" data-lang="'+lg+'" aria-label="Anhören">&#128266;</button>')+(p[2]?'<span class="em" aria-hidden="true">'+p[2]+'</span>':'')+'<b>'+esc(p[0])+'</b>'+(p[3]?'<span class="pr">['+esc(p[3])+']</span>':'')+'<span class="hintline">'+(v.nospk?'Tippen zum Drehen':'Tippen zum Aufdecken')+'</span><span class="back">'+esc(p[1])+'</span></div>'}).join('')+'</div>';
}
function vLines(v){return '<div class="lines'+(v.num?' num':'')+'">'+v.items.map(function(p){return '<div class="ln">'+(p[1]?'<em>'+rt(p[1])+'</em>':'')+'<code>'+rt(p[0])+'</code></div>'}).join('')+'</div>'}
function vImg(v){return '<figure class="vis"><img class="pic" src="'+esc(v.src)+'" alt="'+esc(v.alt||'')+'"></figure>'}
function visuals(list){
  if(!list||!list.length)return '';
  var map={dots:vDots,pie:vPie,numberline:vLine,pairs:vPairs,flip:vFlip,lines:vLines,img:vImg};
  return '<div class="visrow">'+list.map(function(v){return map[v.type]?map[v.type](v):''}).join('')+'</div>';
}

function curCard(n){
  var k=n.queue[n.idx],x=cardIdx[k];
  if(!n.cur){
    var g=x.c.gen?genCard(x.c.gen):null;
    n.cur=g?{id:x.c.id,q:g.q,a:g.a,steps:g.steps,hints:g.hints,solvis:g.solvis,gen:x.c.gen,th:x.c.th}:x.c;
    n.qs=n.qs||{};n.qs[k]=n.cur;
  }
  return n.cur;
}
function stageOf(n,k){
  if(n.ls[k]==null){var b=(prog(n.child).cards[k]||{b:0}).b,s=b<1?0:b<2?1:b<3?2:3;n.start[k]=s;n.fin[k]=Math.max(2,s);n.ls[k]=s}
  return n.ls[k];
}
function groupKey(c){return c.grp||(wc(c.fw)>3?'sent':'misc')}
function makeOpts(n,k,c){
  if(n.opts)return n.opts;
  var x=cardIdx[k],g=groupKey(c),seen={},out=[];seen[c.de[0]]=1;
  function add(list){shuffle(list).forEach(function(o){if(out.length<5&&!seen[o.de[0]]){seen[o.de[0]]=1;out.push(o)}})}
  var inQ=n.queue.map(function(q){return cardIdx[q].c}).filter(function(o){return isV(o)&&o.id!==c.id});
  var inT=x.t.cards.filter(function(o){return isV(o)&&o.id!==c.id});
  add(inQ.filter(function(o){return groupKey(o)===g}));
  add(inT.filter(function(o){return groupKey(o)===g}));
  add(inQ);add(inT);
  n.opts=shuffle(out.map(function(o){return {t:o.de[0],ok:false}}).concat([{t:c.de[0],ok:true}]));n.gone=[];
  return n.opts;
}
function qa(c){return isV(c)?[c.fw,c.de.join(' / ')]:[c.q,c.a]}
function theoryOf(k,c){
  var x=cardIdx[k],key=isV(c)?c.grp:(x.c.th||c.th);
  return key&&x.t.theory&&x.t.theory[key]?x.t.theory[key]:null;
}
function hintList(n,k,c,stg){
  var out=[],th=theoryOf(k,c),i;
  if(th)out.push({k:'theory',th:th});
  if(isV(c)){
    if(stg===0){out.push({k:'elim'});out.push({k:'elim'})}
    else if(stg===2){for(i=0;i<3;i++)out.push({k:'tile'})}
    else textHints(stg===3?c.fw:c.de[0]).forEach(function(t){out.push({k:'text',t:t})});
    return out;
  }
  var base=c.hints&&c.hints.length?c.hints:(checkable(c)||wc(derive(c.a))>4?textHints(derive(c.ans?c.ans[0]:c.a)):[]);
  base.forEach(function(t){out.push({k:'text',t:t})});
  return out;
}
function hintBoxes(n,hs){
  var h='',i,tcount=0;

  if(n.phase==='intro')return '<div class="stack"><div><p class="eyebrow">Musterprüfung</p><h1>'+esc(t.title)+'</h1></div>'+coach('Ist nur eine Musterprüfung. Hier darf noch jeder Fehler passieren.',1)+'<section class="card"><p>'+qs.length+' Fragen · Note von 1 bis 6</p><p class="sub" style="margin-top:8px">Antworte so, wie du es in der Schule tun würdest. Ohne Tipps, ohne Nachschauen.'+(mathe?' Für Zwischenschritte kannst du bei jeder Frage «Notizen machen» öffnen.':'')+' Es gibt keinen Zeitdruck. Für jede richtige Antwort gibt es XP, für gute Noten einen Bonus.</p></section>'+(mathe?'':'<div class="modes"><button class="btn'+(n.mode!=='kurz'?' pri':'')+'" data-act="emode" data-m="alles">Alles</button><button class="btn'+(n.mode==='kurz'?' pri':'')+'" data-act="emode" data-m="kurz">Kurztext</button></div>')+'<div class="row"><button class="btn pri big" data-act="start">Los geht\'s</button><button class="btn big" data-act="back">Zurück</button></div></div>';
  if(n.phase==='run'&&!mathe)return vPaper(n,t,qs);

    var dt=new Date(),ds=dt.getDate()+'.'+(dt.getMonth()+1)+'.'+dt.getFullYear();
    var html='<div class="paperpage"><p class="ptitle">Prüfung · '+esc(t.title)+'</p><div class="sheet"><div class="shead"><span>Name: <b>'+esc(n.pname||'')+'</b></span><span>Datum: <b>'+ds+'</b></span></div><p class="sub" style="margin:0 0 4px">Alle Brüche so weit wie möglich kürzen.</p><ol class="mq">';
    qs.forEach(function(q,i){
      var key='e:'+t.id+':'+q.id,pd=padHTML(key,q.q);
      html+='<li><div class="mqt"><b>'+(i+1)+'.</b>'+rt(q.q)+'</div>'+visuals(q.visuals)+'<input class="pin" id="in-'+q.id+'" data-q="'+q.id+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(n.answers[q.id]||'')+'"><div class="tools">'+pd.btn+'</div>'+pd.box+'</li>';
    });
    html+='</ol></div>';
    return html+'<button class="btn pri big" data-act="finish">Abgeben</button></div>';
  }
  var r=n.result,msg=r.note>=5.5?'Wow! Das war fast zu einfach.':r.note>=4.5?'Stark gemacht. Noch ein bisschen Feinschliff.':r.note>=4?'Bestanden! Übe noch die Aufgaben, die nicht geklappt haben.':'Das war ein Aufwärmen. Die Aufgaben, die nicht geklappt haben, üben wir jetzt zusammen.';
  var mood=r.note>=5.5?4:r.note>=4.5?3:r.note>=4?2:1;
  var html3='<div class="stack"><div><p class="eyebrow">Ergebnis</p><h1>'+esc(t.title)+'</h1></div><section class="card row"><div class="grade">'+fmt(r.note)+'</div><div class="grow"><h2>'+r.score+' von '+r.max+' richtig</h2><p class="sub">Note 1 bis 6 · +'+r.xp+' XP</p></div></section>'+'<p class="sub" style="margin:0">'+esc(msg)+'</p>';
  r.items.forEach(function(it,i){
    var ans=it.q.type==='mc'?it.q.options[it.q.answer]:it.q.answer[0],given=it.q.type==='mc'?(it.g==null?'':it.q.options[it.g]):(it.g||'');
    html3+='<div class="rl '+(it.ok?'ok':'no')+'"><span class="rm">'+(it.ok?'✓':'✗')+'</span><div class="rb"><span class="rq">'+(i+1)+'. '+rt(it.q.q)+'</span>'+(it.ok?'<span class="ra"><b>'+rt(ans)+'</b></span>':'<span class="ra">Deine Antwort: '+(given?esc(given):'<i>keine</i>')+' · Richtig: <b>'+rt(ans)+'</b></span>')+(!it.ok&&it.q.explain&&it.q.explain.indexOf(ans)<0?'<span class="why">'+rt(it.q.explain)+'</span>':'')+'</div></div>';
  });
  return html3+'<div class="row"><button class="btn pri big" data-act="retake">Noch einmal</button><button class="btn big" data-act="practice" data-scope="topic:'+esc(t.id)+'" data-force="1">Falsche Aufgaben üben</button><button class="btn ghost" data-act="back">Fertig</button></div></div>';
}


var VIEWS={home:vHome,child:vChild,subject:vSubject,learn:vLearn,practice:vPractice,exam:vExam,game:vGame,parent:vParent};

function top(){if(nav.view==='home')return '<header class="top" style="min-height:8px"></header>';return '<header class="top"><button class="brand" data-act="home" aria-label="Zur Startseite">'+logoSvg(34)+'<span class="wm">EasySchool</span></button><button class="btn back" data-act="back">← Zurück</button></header>'}
function render(){
  clearInterval(timer);timer=null;
  SKIN=nav.child?skinOf(nav.child):null;
  app.innerHTML=top()+banner()+VIEWS[nav.view]();
  updateSync();
  initPads();
  if(nav.view==='practice'&&nav.queue&&nav.idx<nav.queue.length&&!nav.revealed){
    var cc=curCard(nav);
    if(isV(cc)){var sg=stageOf(nav,nav.queue[nav.idx]);if(sg===1||sg===3){var ai=document.getElementById('ans');if(ai&&ai.focus)try{ai.focus()}catch(e){}}}
  }
  if(nav.view==='learn'){
    var t=topicById(nav.topicId);
    if(nav.step===t.explain.length-1){var p=prog(nav.child);if(!p.seen[t.id]){p.seen[t.id]=Date.now();addXp(nav.child,10);toast('+10 XP fürs Anschauen','');ach(nav.child,'learn');save(nav.child)}}
  }
  if(nav.view==='exam'&&nav.phase==='run'){
    var tick=function(){var el=document.getElementById('timer');if(!el)return;var rem=Math.round(topicById(nav.topicId).exam.minutes*60-(Date.now()-nav.started)/1000);el.textContent=mmss(rem);el.classList.toggle('late',rem<0)};
    tick();timer=setInterval(tick,1000);
  }
}
function go(n,from){
  n.from=from===undefined?nav:from;nav=n;
  try{var h=n.child||'';if(location.hash.slice(1)!==h)history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''))}catch(e){}
  render();window.scrollTo(0,0);
}
function resetCard(n){n.hintN=0;n.pen=0;n.typed='';n.verdict=null;n.err='';n.accentNote='';n.revealed=false;n.cur=null;n.opts=null;n.gone=[];n.chosen=null;n.pz=null}
function clearPads(prefix){Object.keys(PADS).forEach(function(k){if(k.indexOf(prefix)===0)delete PADS[k]})}
function requeue(n,k,off){n.queue.splice(Math.min(n.idx+off,n.queue.length),0,k)}

/* ---------- Bewertung, XP, Runde ---------- */
function applyRate(r){
  var n=nav,k=n.queue[n.idx],p=prog(n.child),prev=p.cards[k]||{b:0,n:0,k:0,d:0,t:0},now=Date.now(),b,d,v=isV(cardIdx[k].c),base,bonus=0;
  if(r==='again'){b=v?Math.max(0,prev.b-1):0;d=now}
  else if(r==='hard'){b=Math.max(1,prev.b);d=now+INT[b]*DAY}
  else{b=Math.min(5,prev.b+1);d=now+INT[b]*DAY}
  p.cards[k]={b:b,d:d,n:prev.n+1,k:prev.k+(r==='again'?1:0),t:now};
  n.res[k]=r;n.lastR=r;
  if(r==='again'&&(n.again[k]||0)<3){n.again[k]=(n.again[k]||0)+1;requeue(n,k,4)}
  base={good:10,hard:6,again:2}[r];
  if(r==='again'&&n.pw.indexOf('shield')>=0&&!n.shieldUsed){n.shieldUsed=true;n.perfect=false;toast('🛡️ Schild: Deine Combo ist gerettet','gold')}
  else if(r==='good'){
    n.combo++;
    if(n.combo%5===0){bonus=n.combo===5?20:n.combo===10?40:60;n.bonus.push('Combo x'+n.combo+' +'+bonus);toast('Combo x'+n.combo+'! +'+bonus+' XP','gold')}
    if(n.combo>=5)ach(n.child,'combo5');
  }else{n.perfect=false;if(r==='again')n.combo=0}
  n.lastXp=addXp(n.child,(base+bonus)*(n.pw.indexOf('x2')>=0?2:1));n.xp+=n.lastXp;
  save(n.child);
}
function advance(){
  var n=nav;n.msg=(n.lastXp?'+'+n.lastXp+' XP · ':'')+pick(CHEER[n.lastR||'good'],n.idx+n.queue.length);n.lastXp=0;
  n.idx++;resetCard(n);
  if(n.idx>=n.queue.length)finishRound(n);
  render();window.scrollTo(0,0);
}
function finishRound(n){
  if(n.done)return;n.done=true;
  var keys=Object.keys(n.res);if(!keys.length)return;
  var t=15;n.bonus.push('Runde geschafft +15');
  if(n.perfect&&keys.length>=3){t+=25;n.bonus.push('Perfekte Runde +25');ach(n.child,'perfect');toast('Perfekte Runde! +25 XP','gold')}
  n.xp+=addXp(n.child,t);ach(n.child,'first');checkPassive(n.child);save(n.child);
}
function doRate(r){logAnswer(nav.child,r!=='again');applyRate(r);advance()}
function vocabOutcome(r){
  var n=nav,k=n.queue[n.idx],s=stageOf(n,k),fin=n.fin[k];
  logAnswer(n.child,r!=='again');
  if(r==='again'){n.ls[k]=Math.max(0,s-1);applyRate('again');return}
  if(r==='hard')n.worst[k]='hard';
  if(s<fin){n.ls[k]=s+1;n.lastR='good';n.lastXp=addXp(n.child,4*(n.pw.indexOf('x2')>=0?2:1));n.xp+=n.lastXp;requeue(n,k,4);save(n.child);return}
  applyRate(n.worst[k]==='hard'&&r==='good'?'hard':r);
}

/* ---------- Aktionen ---------- */
var ACT={
  home:function(){go({view:'home'},null)},
  parent:function(){go({view:'parent'},{view:'home'})},
  back:function(){
    var f=nav.from;
    while(f&&(f.view==='practice'||f.view==='exam'||f.view==='learn'||f.view==='game'))f=f.from;
    if(!f)f=nav.child&&nav.view!=='child'?{view:'child',child:nav.child,from:{view:'home'}}:{view:'home'};
    go(f,f.from||null);
  },
  child:function(b){go({view:'child',child:b.dataset.id},{view:'home'})},
  subject:function(b){go({view:'subject',child:nav.child,subject:b.dataset.id})},
  learn:function(b){go({view:'learn',child:nav.child,topicId:b.dataset.id,step:0,qz:{}})},
  next:function(){nav.step++;nav.fails=0;render();window.scrollTo(0,0)},
  prev:function(){nav.step--;nav.fails=0;render();window.scrollTo(0,0)},
  avopen:function(){nav.avpick=true;render()},
  avclose:function(){nav.avpick=false;render()},
  avpick:function(b){setMyAv(parseInt(b.dataset.id,10));render()},
  power:function(b){var p=prog(nav.child),id=b.dataset.id,i=p.arm.indexOf(id);if(i>=0)p.arm.splice(i,1);else{var w=POW.filter(function(x){return x.id===id})[0];if(!powReady(nav.child,w))return;p.arm.push(id)}saveLocal();render()},
  powinfo:function(b){var w=POW.filter(function(x){return x.id===b.dataset.id})[0],p=prog(nav.child);toast(w.ic+' '+w.n+': '+(w.lvl>plinfo(nav.child).L?'ab Rang '+w.lvl:p.pw[w.id]===dkey(0)?'heute schon genutzt':w.d),'')},
  aura:function(b){var p=prog(nav.child);p.aura=b.dataset.id;p.auraT=Date.now();save(nav.child);render()},
  skip:function(){var n=nav;if(n.skipUsed)return;n.skipUsed=true;var k=n.queue[n.idx];n.lastXp=0;n.lastR='good';n.queue.push(k);toast('⏩ Joker benutzt','gold');advance()},
  skin:function(b){var p=prog(nav.child);p.skin=b.dataset.id;p.skinT=Date.now();save(nav.child);render()},
  flip:function(b){if(b.classList)b.classList.toggle('on')},
  speak:function(b){try{var u=new SpeechSynthesisUtterance(b.dataset.t);u.lang=b.dataset.lang||'en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},
  qz:function(b){nav.qz=nav.qz||{};var key=nav.step+'_'+b.dataset.q;if(nav.qz[key]!=null)return;nav.qz[key]=+b.dataset.i;render()},
  topt:function(b){var T=topicById(nav.topicId).explain[nav.step].try,o=T.opts[+b.dataset.i],i=nav.step;nav.topt=nav.topt||{};var ch=nav.topt[i]||(nav.topt[i]={});if(o===T.a[0])ch.ok=true;else{ch.bad=(ch.bad||[]).concat([o])}render()},
  dslot:function(b){var i=nav.step,si=+b.dataset.si,pl=nav.dr[i];if(pl[si]){pl[si]=null;nav.dr[i+'ok']=undefined}else if(nav.dsel){pl[si]=nav.dsel;nav.dsel=null}render()},
  dcheck:function(){var T=topicById(nav.topicId).explain[nav.step].try,i=nav.step,pl=nav.dr[i];nav.dr[i+'ok']=pl.every(function(x,k){return x===T.a[k]});render()},
  dreset:function(){var T=topicById(nav.topicId).explain[nav.step].try,i=nav.step;nav.dr[i]=T.drag.slots.map(function(){return null});nav.dr[i+'ok']=undefined;nav.dsel=null;render()},
  mpick:function(b){var n=nav,o=n.opts[+b.dataset.i];n.typed=o.t;n.chosen=+b.dataset.i;n.revealed=true;n.verdict=o.ok?'ok':'no';render()},
  try:function(){
    var st=topicById(nav.topicId).explain[nav.step].try,inp=document.getElementById('tryin'),fb=document.getElementById('tryfb'),r=checkAns(inp.value,st.a);
    if(r.empty){fb.className='fb no';fb.textContent='Schreibe zuerst deine Antwort auf.';return}
    if(r.ok){fb.className='fb ok';fb.textContent='Richtig!'+(r.accent?' Achte auf die Schreibweise: '+r.accent:'')}
    else{nav.fails=(nav.fails||0)+1;fb.className='fb no';fb.textContent=nav.fails>=2?'Noch nicht. Die Lösung ist: '+st.a[0]:'Noch nicht ganz. Schau nochmal ins Bild und probiere es nochmal.'}
  },
  tryhint:function(){var st=topicById(nav.topicId).explain[nav.step].try,fb=document.getElementById('tryfb');fb.className='fb no';fb.textContent='Tipp: '+st.hint},
  practice:function(b){
    var child=nav.child,scope=parseScope(b.dataset.scope),force=!!b.dataset.force,topics=scopeTopics(child,scope),from=nav;
    while(from&&(from.view==='practice'||from.view==='exam'||from.view==='learn'||from.view==='game'))from=from.from;
    var n={view:'practice',child:child,subject:nav.subject,scope:scope,queue:buildQueue(child,topics,force),idx:0,res:{},again:{},padOpen:{},qs:{},ls:{},fin:{},start:{},worst:{},xp:0,combo:0,bonus:[],perfect:true,lastXp:0,pw:[],skipUsed:false,shieldUsed:false};
    var pp=prog(child);
    if(n.queue.length&&pp.arm.length){n.pw=pp.arm.slice();n.pw.forEach(function(id){pp.pw[id]=dkey(0)});pp.arm=[];save(child);toast('Kraft aktiv: '+n.pw.map(function(id){return POW.filter(function(x){return x.id===id})[0].ic}).join(' '),'gold')}
    resetCard(n);
    go(n,from||{view:'child',child:child,from:{view:'home'}});
  },
  hint:function(){
    var n=nav,k=n.queue[n.idx],c=curCard(n),stg=isV(c)?stageOf(n,k):0,hs=hintList(n,k,c,stg),it=hs[n.hintN];
    if(!it)return;
    n.hintN++;if(it.k!=='theory'&&n.pw.indexOf('free')<0)n.pen++;
    if(it.k==='elim'){
      var o=makeOpts(n,k,c),cand=[];o.forEach(function(op,i){if(!op.ok&&n.gone.indexOf(i)<0)cand.push(i)});
      shuffle(cand).slice(0,2).forEach(function(i){n.gone.push(i)});
    }
    if(it.k==='tile'){
      var pz=pzInit(n,c),i;
      for(i=0;i<pz.sel.length;i++){if(pz.tiles[pz.sel[i]]!==pz.u[i]){pz.sel=pz.sel.slice(0,i);break}}
      var want=pz.u[pz.sel.length];
      for(i=0;i<pz.tiles.length;i++){if(pz.sel.indexOf(i)<0&&pz.tiles[i]===want){pz.sel.push(i);break}}
    }
    render();
  },
  pick:function(b){
    var n=nav;if(n.revealed)return;var i=+b.dataset.i,ok=n.opts[i].ok;
    n.chosen=i;n.revealed=true;n.verdict=ok?'ok':'no';
    vocabOutcome(ok?(n.pen>=2?'hard':'good'):'again');render();
  },
  tile:function(b){var n=nav;if(n.revealed||!n.pz)return;var i=+b.dataset.i;if(n.pz.sel.indexOf(i)<0)n.pz.sel.push(i);render()},
  untile:function(){var n=nav;if(n.pz)n.pz.sel.pop();render()},
  pzclear:function(){var n=nav;if(n.pz)n.pz.sel=[];render()},
  pzcheck:function(){
    var n=nav,c=curCard(n),built=pzBuilt(n,c),r=checkAns(built,[c.fw]);
    n.typed=built;n.revealed=true;n.verdict=r.ok?'ok':'no';
    vocabOutcome(r.ok?(n.pen>=2?'hard':'good'):'again');render();
  },
  check:function(){
    var n=nav,c=curCard(n),inp=document.getElementById('ans'),val=inp?inp.value:(n.typed||'');
    n.typed=val;
    if(!val.trim()){n.err='Schreib zuerst dein Ergebnis hin.';render();return}
    if(isV(c)){
      var stg=stageOf(n,n.queue[n.idx]),list=stg===3?[c.fw]:c.de,r=checkAns(val,list);
      n.revealed=true;n.err='';n.accentNote=r.accent||'';
      if(r.ok){n.verdict='ok';vocabOutcome(n.pen>=2?'hard':'good')}
      else if(nearMiss(val,list)){n.verdict='near';vocabOutcome('hard')}
      else{n.verdict='no';vocabOutcome('again')}
      render();return;
    }
    var r2=checkAns(val,cardAns(c));
    n.revealed=true;n.err='';n.verdict=r2.ok?'ok':isSoft(c)?'near':'no';n.accentNote=r2.accent||'';render();
  },
  reveal:function(){
    var n=nav;n.revealed=true;
    if(isV(curCard(n))){n.verdict='no';vocabOutcome('again')}else n.verdict=null;
    render();
  },
  next2:function(){advance()},
  rate:function(b){doRate(b.dataset.r)},
  pad:function(b){var key=b.dataset.key;nav.padOpen=nav.padOpen||{};nav.padOpen[key]=!padOpen(key);render()},
  tool:function(b){penTool=b.dataset.tool;Array.prototype.forEach.call(document.querySelectorAll('.tool[data-tool]'),function(el){el.classList.toggle('on',el.dataset.tool===penTool)})},
  padundo:function(b){var s=PADS[b.dataset.key];if(s){s.pop();Array.prototype.forEach.call(document.querySelectorAll('.padcv'),function(cv){if(cv.dataset.key===b.dataset.key)redraw(cv)})}},
  padclear:function(b){PADS[b.dataset.key]=[];Array.prototype.forEach.call(document.querySelectorAll('.padcv'),function(cv){if(cv.dataset.key===b.dataset.key)redraw(cv)})},
  pairs:function(b){
    var t=topicById(b.dataset.id),words=t.cards.filter(function(c){return isV(c)&&wc(c.fw)<=2}),items=shuffle(words).slice(0,6);
    go({view:'game',child:nav.child,topicId:t.id,items:items,right:shuffle(items.map(function(c){return c.id})),sel:null,done:{},miss:0,bad:null,started:Date.now(),finished:false,xp:0},{view:'subject',child:nav.child,subject:t.subject,from:{view:'child',child:nav.child,from:{view:'home'}}});
  },
  pl:function(b){var n=nav;if(n.done[b.dataset.id])return;n.sel=b.dataset.id;n.bad=null;render()},
  pr:function(b){
    var n=nav;if(n.sel==null||n.done[b.dataset.id])return;
    if(n.sel===b.dataset.id){
      n.done[n.sel]=1;n.sel=null;n.bad=null;
      if(Object.keys(n.done).length===n.items.length){
        n.finished=true;n.secs=Math.round((Date.now()-n.started)/1000);
        var x=Math.max(6,24-2*n.miss)+(n.miss===0?15:0);n.xp=addXp(n.child,x);
        logAnswer(n.child,true);ach(n.child,'pairs');checkPassive(n.child);save(n.child);
      }
    }else{n.miss++;n.bad=b.dataset.id;n.sel=null;logAnswer(n.child,false)}
    render();
  },
  exam:function(b){go({view:'exam',child:nav.child,subject:nav.subject,topicId:b.dataset.id,phase:'intro',answers:{},padOpen:{}})},
  emode:function(b){nav.mode=b.dataset.m;nav.qlist=null;render()},
  start:function(){nav.pname=funnyName(topicById(nav.topicId));nav.qlist=mkQs(nav,topicById(nav.topicId));clearPads('e:'+nav.topicId+':');nav.phase='run';nav.started=Date.now();nav.answers={};nav.padOpen={};render();window.scrollTo(0,0)},
  retake:function(){clearPads('e:'+nav.topicId+':');nav.phase='intro';nav.answers={};nav.result=null;nav.qlist=null;render();window.scrollTo(0,0)},
  finish:function(){finishExam()}
};
function finishExam(){
  var n=nav,t=topicById(n.topicId),p=prog(n.child),now=Date.now(),score=0;
  var qsx=examQs(n,t);var items=qsx.map(function(q){
    var g=n.answers[q.id],ok=false,note='';
    if(q.type==='mc')ok=g===q.answer;else{var r=checkAns(g||'',q.answer);ok=r.ok;if(r.accent)note=r.accent}
    if(ok)score++;
    else if(q.ref){var k=t.id+'_'+q.ref,prev=p.cards[k]||{b:0,n:0,k:0,d:0,t:0};p.cards[k]={b:0,d:now,n:prev.n,k:prev.k+1,t:now}}
    logAnswer(n.child,ok);
    return {q:q,g:g,ok:ok,note:note};
  });
  var max=qsx.length,note=grade(score,max),xp=5*score+(note>=5?30:0)+(note>=5.75?20:0);
  p.exams.push({topic:t.id,score:score,max:max,note:note,t:now});
  addXp(n.child,xp);if(note>=5)ach(n.child,'exam5');checkPassive(n.child);
  save(n.child);n.phase='result';n.result={items:items,score:score,max:max,note:note,xp:xp};render();window.scrollTo(0,0);
}

app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;if(nav.child)touch(nav.child);var f=ACT[b.dataset.act];if(f)f(b)});
app.addEventListener('change',function(e){var t=e.target,q=t&&t.dataset&&t.dataset.q;if(q&&nav.view==='exam'&&t.tagName==='SELECT')nav.answers[q]=t.value===''?null:Number(t.value)});
app.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='ans'&&nav.view==='practice'){nav.typed=t.value;return}
  var q=t.dataset&&t.dataset.q;if(!q||nav.view!=='exam')return;nav.answers[q]=t.type==='radio'?Number(t.value):t.value;
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='tryin'){e.preventDefault();ACT.try()}
  if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();ACT.check()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('flipc')){e.preventDefault();ACT.flip(e.target)}
});
document.addEventListener('keydown',function(e){
  if(nav.view!=='practice'||nav.idx>=nav.queue.length||document.activeElement!==document.body)return;
  if(nav.revealed){
    if(isV(curCard(nav))){if(e.key==='Enter')advance();return}
    var m={'1':'again','2':'hard','3':'good'}[e.key];if(m)doRate(m);
  }
});
var rz=null;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(initPads,200)});
function route(){
  var h=location.hash.slice(1),ch=C.children.filter(function(c){return c.id===h})[0];
  if(ch&&!(nav.child===ch.id&&nav.view!=='home')){nav={view:'child',child:ch.id,from:{view:'home'}};render()}
  else if(!h&&nav.view!=='home'&&nav.view!=='parent'&&nav.view!=='learn'&&nav.view!=='practice'&&nav.view!=='exam'&&nav.view!=='game'){nav={view:'home'};render()}
}
window.addEventListener('hashchange',function(){if(C)route()});

fetch('content.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
  C=j;C.topics.forEach(function(t){t.cards.forEach(function(c){cardIdx[t.id+'_'+c.id]={c:c,t:t}})});
  loadLocal();
  var h=location.hash.slice(1),ch=C.children.filter(function(c){return c.id===h})[0];
  nav=ch?{view:'child',child:ch.id,from:{view:'home'}}:{view:'home'};
  render();initDb();
}).catch(function(){app.innerHTML='<div class="card err"><h2>Die Lerninhalte konnten nicht geladen werden</h2><p class="sub">Lade die Seite neu. Wenn es weiter nicht klappt, melde dich bei Papa oder Mama.</p></div>'});
/* Ziehen (Pointer) für Theorie-Aufgaben */
(function(){var drag=null;
 app.addEventListener('pointerdown',function(e){var c=e.target.closest&&e.target.closest('.dchip');if(!c)return;e.preventDefault();
  drag={chip:c.dataset.chip,x:e.clientX,y:e.clientY,moved:false,ghost:null,el:c}});
 window.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>8){drag.moved=true;var g=drag.el.cloneNode(true);g.className='dchip ghost';document.body.appendChild(g);drag.ghost=g}
  if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';var t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest&&t.closest('.dslot');Array.prototype.forEach.call(document.querySelectorAll('.dslot'),function(x){x.classList.toggle('hot',x===s)})}});
 window.addEventListener('pointerup',function(e){if(!drag)return;var d=drag;drag=null;
  if(d.ghost){d.ghost.style.display='none';var t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest&&t.closest('.dslot');d.ghost.remove();
   if(s&&nav.view==='learn'){var si=+s.dataset.slot,pl=nav.dr[nav.step];if(!pl[si]){pl[si]=d.chip;nav.dr[nav.step+'ok']=undefined}nav.dsel=null}render()}
  else{nav.dsel=nav.dsel===d.chip?null:d.chip;render()}});
 window.addEventListener('pointercancel',function(){if(drag&&drag.ghost)drag.ghost.remove();drag=null});
})();
})();

</script>
